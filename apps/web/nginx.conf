server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html para
    # que react-router-dom resuelva /dashboard, /pets/:id, /p/:qrToken, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
